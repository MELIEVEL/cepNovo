<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>PROCURE O CEP</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="main.js" defer></script>
    <title>Busca de CEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #000000;
            --secondary-color: #6690eb;
            --text-color: #8377eb;
            --bg-color: #f3f4f6;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-xl);
            line-height: 1.5;
        }

        .caixa-principal {
            width: 100%;
            max-width: 500px;
            background-color: rgb(170, 165, 241);
            padding: var(--spacing-xl);
            border-radius: 8px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .titulo {
            color: var(--primary-color);
            margin-bottom: var(--spacing-lg);
            font-size: 1.8rem;
        }

        input[type="text"] {
            width: 100%;
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        input[type="button"],
        input[onclick] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-bottom: var(--spacing-xl);
        }

        input[type="button"]:hover,
        input[onclick]:hover {
            background-color: var(--secondary-color);
        }

        h2 {
            font-size: 1.1rem;
            margin: var(--spacing-sm) 0;
            padding: var(--spacing-sm);
            background-color: var(--bg-color);
            border-radius: 4px;
            text-align: left;
        }

        h2::before {
            content: "• ";
            color: var(--primary-color);
        }

        .endereco {
            margin-top: var(--spacing-lg);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .caixa-principal {
                padding: var(--spacing-lg);
            }

            .titulo {
                font-size: 1.5rem;
            }

            body {
                padding: var(--spacing-md);
            }
        }
    </style>


</head>

<body>
    <div class="caixa-principal">
        <h1 class="titulo">Pesquisa Cep</h1>
        <input type="text" id="cep" placeholder="Digite o cep">
        <input type="button" value="Pesquisar" onclick="coletarcep()">
        <h2 id="endereco" class="endereco">Endereco</h2>
        <h2 id="bairro">Bairro</h2>
        <h2 id="cidade">Cidade</h2>
        <h2 id="estado">Estado</h2>
        <h2 id="regiao">Região</h2>
    </div>

    <script>
        function coletarcep() {
            let cep = document.querySelector("#cep").value
            //console.log(cep)
            receberDados(cep)
        }

        async function receberDados(cep) {
            let dados = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then(x => x.json())
            //console.log(dados)
            dadosTela(dados)
        }

        function dadosTela(dados) {
            document.querySelector("#endereco").innerHTML = dados.logradouro
            document.querySelector("#bairro").innerHTML = dados.bairro
            document.querySelector("#cidade").innerHTML = dados.localidade
            document.querySelector("#estado").innerHTML = dados.uf
            document.querySelector("#regiao").innerHTML = dados.regiao
        }
    </script>


</body>

</html>
